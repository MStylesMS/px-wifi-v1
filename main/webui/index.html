<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PX-WiFi-V1 Console</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="topbar wrap">
        <div class="brand">
            <img src="assets/logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div>
                <p class="kicker">Paradox Prop Console</p>
                <h1>PX-WiFi-V1 Dashboard</h1>
            </div>
        </div>
        <nav class="tabs">
            <a class="tab active" href="index.html">Live</a>
            <a class="tab" href="config.html">Config</a>
            <a class="tab" href="connection.html">Connect</a>
            <div class="status-icons" id="statusIcons"></div>
        </nav>
    </header>

    <main class="wrap layout">
        <section class="panel pulse" id="gameStatePanel">
            <div class="panel-head">
                <h2>Game State</h2>
                <span id="stateBadge" class="badge">loading</span>
            </div>
            <div class="metrics">
                <div class="metric">
                    <p>Time Remaining</p>
                    <h3 id="timeRemaining">--:--</h3>
                </div>
                <div class="metric">
                    <p>Input States</p>
                    <h3 id="inputStatesSummary">-</h3>
                    <div id="inputIndicators" class="input-indicators"></div>
                </div>
                <div id="triesMetric" class="metric">
                    <p>Tries Used</p>
                    <h3 id="triesUsed">-</h3>
                </div>
                <div class="metric">
                    <p>Battery</p>
                    <h3 id="batteryValue">--</h3>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>Quick Actions</h2>
                <button id="refreshBtn" class="btn btn-ghost">Refresh</button>
            </div>
            <div class="btn-grid">
                <button class="btn btn-start" data-cmd='{"command":"start"}'>Start</button>
                <button class="btn btn-warn" data-cmd='{"command":"reset"}'>Reset</button>
                <button class="btn btn-pause" data-cmd='{"command":"pause"}'>Pause</button>
                <button class="btn btn-resume" data-cmd='{"command":"resume"}'>Resume</button>
                <button class="btn btn-solve" data-cmd='{"command":"solve"}'>Solve</button>
                <button class="btn btn-danger" data-cmd='{"command":"fail"}'>Fail</button>
            </div>
            <pre id="actionLog" class="log"></pre>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        window.PX.pageDashboard();
    </script>
</body>
</html>
